[package]
name = "dice-desktop"
version = "0.1.0"
edition = "2021"
description = "Dice — CDC chunk store with dedup sync (desktop + CLI)"
authors = ["Dice"]
default-run = "dice"

[[bin]]
name = "dice"
path = "src/bin/dice.rs"

[[bin]]
name = "dice-desktop"
path = "src/bin/dice-desktop.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:image"]

[dependencies]
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
fastcdc = "3.1"
fs4 = "0.12"
memmap2 = "0.9"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
webpki-roots = "0.26"
zstd = "0.13"

# GUI-only (optional so CLI builds cleanly on servers / more platforms)
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.31", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.15", optional = true }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
